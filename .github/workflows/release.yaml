name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '.introspect'
  workflow_dispatch:

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Read plugin version
        id: version
        run: |
          TAG=$(jq -r '"v\(.version_major).\(.version_minor).\(.version_patch)"' .introspect)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build plugin + client
        run: |
          for PKG in "zoraxy-tunnel:." "tunnel-client:./client"; do
            BINARY="${PKG%%:*}"
            PKGDIR="${PKG##*:}"
            for TARGET in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
              GOOS="${TARGET%/*}"
              GOARCH="${TARGET#*/}"
              OUTPUT="${BINARY}_${GOOS}_${GOARCH}"
              [ "$GOOS" = "windows" ] && OUTPUT="${OUTPUT}.exe"
              GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags="-s -w" -o "$OUTPUT" "$PKGDIR"
              echo "built $OUTPUT"
            done
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            zoraxy-tunnel_*
            tunnel-client_*

  build-docker:
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        run: |
          TAG=$(jq -r '"v\(.version_major).\(.version_minor).\(.version_patch)"' .introspect)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./client/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/miranoverhoef/tunnel-client:latest
            ghcr.io/miranoverhoef/tunnel-client:${{ steps.version.outputs.tag }}
