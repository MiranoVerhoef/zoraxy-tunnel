name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build plugin + client
        run: |
          # build every target for both binaries
          for PKG in "zoraxy-tunnel:." "tunnel-client:./client"; do
            PLUGIN="${PKG%%:*}"
            PKGDIR="${PKG##*:}"
            for TARGET in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
              GOOS="${TARGET%/*}"
              GOARCH="${TARGET#*/}"
              OUTPUT="${PLUGIN}_${GOOS}_${GOARCH}"
              [ "$GOOS" = "windows" ] && OUTPUT="${OUTPUT}.exe"
              GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags="-s -w" -o "$OUTPUT" "$PKGDIR"
              echo "built $OUTPUT"
            done
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            zoraxy-tunnel_*
            tunnel-client_*

  build-docker:
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./client/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tunnel-client:latest
            ghcr.io/${{ github.repository_owner }}/tunnel-client:${{ github.ref_name }}
